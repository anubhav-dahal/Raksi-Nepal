# .github/workflows/guard-issue-close.yml
name: Guard issue close

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  guard:
    if: >-
      github.event.issue.state_reason != 'not_planned' &&
      !contains(github.event.issue.labels.*.name, 'ceremony') &&
      !contains(github.event.issue.labels.*.name, 'no-pr')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // give GitHub a moment to link the merged PR
            await new Promise(r => setTimeout(r, 15000));

            const q = `query($o:String!,$r:String!,$n:Int!){
              repository(owner:$o,name:$r){
                issue(number:$n){
                  closedByPullRequestsReferences(first:10, includeClosedPrs:true){
                    nodes{ merged reviewDecision }
                  }
                }
              }
            }`;
            const { repository } = await github.graphql(q, {
              o: context.repo.owner,
              r: context.repo.repo,
              n: context.issue.number,
            });
            const prs = repository.issue.closedByPullRequestsReferences.nodes;
            const ok = prs.some(p => p.merged && p.reviewDecision === 'APPROVED');

            if (!ok) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: context.issue.number,
                state: 'open',
              });
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `Reopened: close this with a merged PR approved by another person ("Closes #${context.issue.number}" in the PR). If it needs no code, add the \`no-pr\` label and close it again.`,
              });
            }
